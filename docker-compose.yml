services:
  postgres:
    image: postgres:17-alpine
    container_name: catalogforge-postgres
    environment:
      POSTGRES_USER: catalogforge
      POSTGRES_PASSWORD: catalogforge
      POSTGRES_DB: catalogforge
    ports:
      # 5433 on the host so it doesn't clash with a Postgres already running on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the separate test database
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogforge -d catalogforge"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
