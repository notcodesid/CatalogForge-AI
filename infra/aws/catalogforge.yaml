AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CatalogForge on AWS: the Next.js web app and the background worker as two ECS Fargate services (ARM64) from one
  image, a private RDS PostgreSQL database that also holds the job queue (pg-boss), an S3 bucket for uploaded files,
  an Application Load Balancer that only CloudFront may reach, and CloudFront for HTTPS. Workers scale on the queue
  backlog the worker reports to CloudWatch. Default VPC, public subnets with public IPs, no NAT gateway.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      One stack for the whole app, so it can be rebuilt with one command. The database stays private: only the web and
      worker tasks reach it. Tasks get public IPs in the default VPC's public subnets instead of a NAT gateway, which
      would cost more than the tasks themselves at this size.
    must: >-
      The image must be built for linux/arm64 and contain the app (see Dockerfile). Migrations run as a one-off task
      with the worker task definition and the command `pnpm db:deploy` (see docs/setup.md).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to run in (the default VPC)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones of that VPC
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: The region's managed prefix list com.amazonaws.global.cloudfront.origin-facing
  ImageUri:
    Type: String
    Description: The app's image in ECR, e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com/catalogforge:abc123
  AnthropicSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:.+"
    Description: Secrets Manager secret (plain text) holding the Anthropic API key
  PostgresVersion:
    Type: String
    Default: "17.6"
    AllowedPattern: "^17(\\.[0-9]+)?$"
    Description: PostgreSQL 17 engine version available in the region
  WorkerCpu:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  WorkerMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["1024", "2048", "4096"]
  WorkerMaxTasks:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: The most workers auto scaling may run. Past the AI provider's rate limit, more workers don't help

Resources:
  # Files ---------------------------------------------------------------------------------------------------------

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Uploaded sheets, photos as uploaded and resized photos, shared by the web app and the workers
        must: Never public. The web app serves photos itself (/api/photos/:id)
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Originals are deleted once resized; old versions only cost money after a week
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-unfinished-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub "${FilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Network -------------------------------------------------------------------------------------------------------

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: The load balancer is only for CloudFront, which adds HTTPS
        must: Ingress only from the CloudFront origin-facing prefix list, never 0.0.0.0/0
    Properties:
      GroupDescription: Load balancer, reachable only from CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web app tasks, reachable only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Load balancer

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Worker tasks, nothing may connect to them
      VpcId: !Ref VpcId

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        must: Only the web and worker tasks may connect. The database is never publicly accessible
    Properties:
      GroupDescription: Database, reachable only from the web app and the workers
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: Web app
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WorkerSecurityGroup
          Description: Workers

  # Database ------------------------------------------------------------------------------------------------------

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} database"
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The catalog, every row's state and the job queue (pg-boss) live here; jobs are queued in the same transaction
          as the work they stand for. RDS keeps the password in Secrets Manager and ECS hands it to the tasks.
        must: Private, encrypted, SSL only (RDS for PostgreSQL 15+ forces SSL by default)
    Properties:
      Engine: postgres
      EngineVersion: !Ref PostgresVersion
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: catalogforge
      MasterUsername: catalogforge
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true

  # Containers ----------------------------------------------------------------------------------------------------

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets ECS pull the image, write logs and read the two secrets the tasks need
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AnthropicSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: What the app itself may do on AWS. Only the files bucket; no access keys anywhere
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${FilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FilesBucket.Arn

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-web"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          Command: [pnpm, start]
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: catalogforge }
            - { Name: S3_BUCKET, Value: !Ref FilesBucket }
            - { Name: S3_REGION, Value: !Ref AWS::Region }
          Secrets:
            - Name: PGUSER
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:username::"
            - Name: PGPASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The worker reads sheets, asks Claude, translates and resizes photos. It reports the queue backlog every
          minute (CatalogForge/QueueBacklog) for auto scaling. Also used for one-off tasks: migrations, reset.
        must: StopTimeout stays high, so a scale-in or deploy lets running AI batches finish
    Properties:
      Family: !Sub "${AWS::StackName}-worker"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Command: [pnpm, worker]
          StopTimeout: 120
          Environment:
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: catalogforge }
            - { Name: S3_BUCKET, Value: !Ref FilesBucket }
            - { Name: S3_REGION, Value: !Ref AWS::Region }
            - { Name: AI_PROVIDER, Value: anthropic }
            - { Name: AI_REQUESTS_PER_MINUTE, Value: "300" }
            - { Name: AI_CONCURRENCY, Value: "10" }
            - { Name: AI_TRANSLATE_CONCURRENCY, Value: "12" }
            - { Name: METRICS_NAMESPACE, Value: CatalogForge }
          Secrets:
            - Name: PGUSER
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:username::"
            - Name: PGPASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Ref AnthropicSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  # Web traffic ---------------------------------------------------------------------------------------------------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # Uploads of a batch of photos can take a while
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: Plain HTTP between CloudFront and the load balancer; viewers only ever get HTTPS from CloudFront
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: HTTPS with CloudFront's own certificate, so no domain is needed. Pages are never cached (they're live);
          Next.js's fingerprinted static files are
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} site"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: load-balancer
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: load-balancer
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled and Managed-AllViewer
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: load-balancer
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # Services ------------------------------------------------------------------------------------------------------

  WebService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref WebSecurityGroup
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref WorkerSecurityGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  # Worker auto scaling -------------------------------------------------------------------------------------------

  WorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One worker when idle, more while jobs pile up. The workers already share the queue and the AI rate limit
          through the database, so adding one needs no coordination
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${WorkerService.Name}"
      MinCapacity: 1
      MaxCapacity: !Ref WorkerMaxTasks

  WorkerScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-worker-scale-out"
      PolicyType: StepScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ExactCapacity
        Cooldown: 60
        MetricAggregationType: Maximum
        # 20 to 99 jobs left: 2 workers. 100 or more: 3 (capped by WorkerMaxTasks)
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            MetricIntervalUpperBound: 80
            ScalingAdjustment: 2
          - MetricIntervalLowerBound: 80
            ScalingAdjustment: 3

  WorkerScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Jobs are piling up; add workers
      Namespace: CatalogForge
      MetricName: QueueBacklog
      Dimensions:
        - Name: Service
          Value: worker
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WorkerScaleOutPolicy

  WorkerScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-worker-scale-in"
      PolicyType: StepScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ExactCapacity
        Cooldown: 300
        MetricAggregationType: Maximum
        StepAdjustments:
          - MetricIntervalUpperBound: 0
            ScalingAdjustment: 1

  WorkerScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The queue has been empty for 10 minutes; back to one worker
      Namespace: CatalogForge
      MetricName: QueueBacklog
      Dimensions:
        - Name: Service
          Value: worker
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref WorkerScaleInPolicy

Outputs:
  SiteUrl:
    Description: The app, over HTTPS
    Value: !Sub "https://${Distribution.DomainName}"
  ClusterName:
    Description: ECS cluster
    Value: !Ref Cluster
  WebServiceName:
    Description: ECS service running the web app
    Value: !GetAtt WebService.Name
  WorkerServiceName:
    Description: ECS service running the workers
    Value: !GetAtt WorkerService.Name
  WorkerTaskDefinitionArn:
    Description: Task definition for one-off tasks (pnpm db:deploy, pnpm reset:data --yes)
    Value: !Ref WorkerTaskDefinition
  WorkerSecurityGroupId:
    Description: Security group for one-off tasks
    Value: !Ref WorkerSecurityGroup
  FilesBucketName:
    Description: S3 bucket with the uploaded files
    Value: !Ref FilesBucket
  DatabaseEndpoint:
    Description: RDS endpoint (private)
    Value: !GetAtt Database.Endpoint.Address
  LogGroupName:
    Description: CloudWatch log group of the web app and the workers
    Value: !Ref LogGroup
